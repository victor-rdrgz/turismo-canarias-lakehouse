apiVersion: v3.2.0
kind: DataContract
id: b72d7538-b9d2-5969-946b-1dc514f5970c
version: 0.1.0
status: draft
name: NASA FIRMS VIIRS 375 m active fire detections, Europe region, last 24 hours
domain: environment
description:
  purpose: 'Near-real-time VIIRS 375 m active fire detections distributed by NASA FIRMS (LANCE) as open CSV files per region
    and platform, covering the last 24 hours. This contract describes the ''Europe'' region files for NOAA-20 and Suomi NPP:
    one row per fire pixel with location, brightness temperatures, scan/track pixel size, acquisition date and time, satellite,
    confidence class, processing version, fire radiative power and day/night flag.'
  limitations: |-
    - Whether the 'Europe' region file covers the Canary Islands is not documented; in the sample the latitude range is 34.4 to 65.8, and no detection falls inside a box around the Canary Islands (27.5-29.5 N, 18.5-13.2 W), which suggests the region does not include them but does not prove it. A different region file or the area API (which requires a free MAP_KEY and was not used) would be needed.
    - Units of scan and track, the time zone of acq_date, and the unit of latitude/longitude are not stated in the attribute table.
    - The files carry version 2.0NRT, which the attribute table (1.0NRT, 1.0) does not list.
    - N21 is documented as a platform value but no NOAA-21 file was sampled. The documentation announces that delivery of new Suomi NPP data ends on 2 November 2026 (so the Suomi NPP file will stop updating).
    - Files hold a rolling 24-hour window (replaced about every 60 minutes per the FAQ, NRT data available within 3 hours of observation, best effort): there is no history, and each download is a snapshot. A day-by-day archive must be built by the consumer.
    - The FIRMS data use policy page returned 404 when first checked; the FAQ states no specific licence. The licence is therefore unverified. No SLA, no uniqueness key and no formal quality rules are documented; the nighttime low-confidence pixels of the South Atlantic Magnetic Anomaly are removed from NRT data.
    - The VIIRS C2 user guide PDF was not read.
  usage: Download the regional 24h CSV periodically and append with a load timestamp, deduplicating on latitude, longitude,
    acq_date, acq_time and satellite. Read acq_time as text. Acknowledge NASA FIRMS (see the FAQ wording) as source.
tags:
- environment
- wildfire
- satellite
- nasa
- firms
- viirs
- near-real-time
