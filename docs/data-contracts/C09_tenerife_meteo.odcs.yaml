apiVersion: v3.2.0
kind: DataContract
id: 95c4060a-6854-542f-a58d-b24b2e6582eb
version: 0.1.0
status: draft
name: Cabildo de Tenerife - Agro-meteorological API (stations, 10-minute readings, daily summaries)
domain: weather
description:
  purpose: Stations, sensors and meteorological readings (temperature, humidity, rain, wind, solar radiation) published
    by the Cabildo Insular de Tenerife through its open data API (OpenAPI 3.0.2, version 2.0.0, path /latest/).
  limitations: 'The OpenAPI schemas do not match the observed responses: responses are nested (stations; readings.sensors[].values[];
    summarized.sensors[].dates[].values[]) and field names differ (municipality vs municipality_id/municipality_name;
    mean_value/min_value/max_value/date vs mean/min/max/total/observation_date). Fields documented but not observed
    are declared as documented. No per-field descriptions or units in the OpenAPI (titles only); units come from
    the sensor catalogue returned by the API itself (/measures: TEMP ºC, HUM %, RAIN mm, WSP m/s, WDR deg., RAD
    W/m2). Time zone of dates not documented (observed timestamps carry no offset). Coordinate reference system
    of x_cords/y_cords and the unit of altitude are not documented. Validation criteria for validated_value and
    is_visual_validated are not documented; update latency not documented; 429 is documented but the rate limit
    is not quantified (no 429 was received). Pagination: 10 days per page (documented in the parameter description).
    The OpenAPI license field points to a user manual PDF that could not be read as text; no licence text was verified
    (the catalogue registry mentions CC BY for the sensors dataset, unverified here). Endpoint /measures/instruments
    and /stations/{id}/sensors were not modelled as entities. Sample coverage: all 68 stations; readings only for
    station 1 sensor 282 (temperature) in two windows (2019-01-01..2019-01-10 and 2026-10-01..2026-10-10; the requested
    2026-10-01..2026-10-23 window returned only page 1 = 10 days); daily summaries only for station 1, year 2025
    (5 sensors). In the summary the empty-string convention for not-applicable statistics is observed, not documented.'
  usage: Raw landing of JSON responses; flatten nested sensors/values arrays to one row per sensor and timestamp
    or date; join readings to stations via id_weatherstation and to the sensor catalogue via id_weatherstationsensor.
tags:
- weather
- tenerife
- stations
- api
- json
- openapi
