apiVersion: v3.2.0
kind: DataContract
id: 19d51ee8-6697-5589-9bf9-9224d761afac
version: 0.1.0
status: draft
name: GBIF Occurrence search API (Canary Islands bounding box)
domain: environment
description:
  purpose: 'GBIF Occurrence API v1 /occurrence/search: species occurrence records (observations, specimens) with taxonomy,
    coordinates, event date, publisher and licence, aggregated by GBIF from many datasets. The sample queries a Canary Islands
    bounding box (country=ES, lat 27 to 29.5, lon -18.5 to -13). Response: paging envelope (offset, limit, endOfRecords, count,
    results, facets) with Occurrence objects.'
  limitations: |-
    - Sample is 2,400 records (300 per selected year, first page in default order), not a random or complete extract; the box query matched about 1.7 million records overall when first checked and per-year counts are listed in sample_selection.
    - Months 1 to 4 only appear in the sample because of the per-year first-page selection; geographic and taxonomic mix is not representative.
    - Rate limits: GBIF states search may return HTTP 429 and the maximum rate varies with load; no fixed rate documented. Maximum offset+limit (deep paging) not documented in the pages read; long extractions should use the download API (requires a GBIF account, not used).
    - Licence is per record (CC0, CC BY, CC BY-NC observed); the sample contains CC BY-NC records, which restricts commercial reuse.
    - Properties documented in the OpenAPI Occurrence schema but absent from the 2,400 sample records are declared with evidence 'documented'.
    - 107 properties appear in the sample but not in the OpenAPI schema (publisher verbatim terms and keys such as http://unknown.org/...); their meaning is not defined by GBIF.
    - Records may contain personal names (recordedBy, identifiedBy, ORCID iDs); examples are deliberately omitted from this contract.
    - No SLA, update schedule or quality thresholds are published; the 'issues' flags are the only per-record quality signal and the full enumeration was not extracted here.
    - Required-ness is taken from the OpenAPI 'required' list of the response schema; some required properties are empty objects/arrays in the sample (e.g. gadm '{}' for some records).
  usage: Page with limit<=300 and offset, one request at a time, with an identifiable User-Agent; use year/country/geometry
    filters to slice. Respect each record's licence and cite dataset DOIs/keys; use the asynchronous download API (account
    required) for large extractions.
tags:
- biodiversity
- species
- gbif
- darwin-core
- canary-islands
- json-api
- occurrences
