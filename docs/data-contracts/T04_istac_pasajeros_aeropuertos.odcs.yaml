apiVersion: v3.2.0
kind: DataContract
id: 391ad7e5-84c2-57ea-8897-c5fcd1aa487b
version: 0.1.0
status: draft
name: ISTAC airport passengers by Canary airport and stopover airport (monthly/annual)
domain: tourism
description:
  purpose: 'Statistical cube C00017A_000001 of the Canary Islands Statistics Institute (ISTAC), operation C00017A (Recopilacion
    de Estadisticas de Transporte Aereo): total passenger traffic at the airports of the Canary Islands by type of air service
    and stopover airport, monthly and annual periods from 2004. Published through the ISTAC statistical-resources API (SDMX-based);
    this contract describes the CSV representation of the latest version (v2.77 when sampled).'
  limitations: |-
    - The producer publishes no per-column data dictionary beyond SDMX dimension/attribute names and codelists; CSV column names (including the #es label columns and OBS_VALUE) are described from the metadata and the sample.
    - The meaning of 'aeropuerto de escala' (origin, destination or previous/next stop) and whether aggregates overlap with their member airports or services are not documented in the metadata read.
    - The unit of OBS_VALUE is not defined by an exported attribute; it is read as passengers from the indicator name.
    - CONFIDENCIALIDAD_OBSERVACION is empty in the whole sample; its codelist is unknown. Annual periods are declared but absent from the sample.
    - Dataset version 2.77 replaces 2.76 (minor series update, 2026-10-14); next version declared NO_UPDATES, but the ~latest alias may still move. No update frequency is declared in the metadata of this dataset.
    - The full cube has 652231 observations in a 3132900-cell grid (well above the sample cap), so the sample is a subset of eight monthly periods obtained with the API dim filter.
    - No SLA, deprecation policy or formal quality/not-null/uniqueness rules were found; the ISTAC legal notice states that ISTAC does not guarantee accuracy, completeness or continuity.
  usage: 'Download the CSV via the ~latest alias (optionally filtering periods with the dim parameter) or pin the version
    in the URL. Read all columns as strings and cast OBS_VALUE explicitly. Cite ''Fuente: Instituto Canario de Estadistica
    (ISTAC)'' and respect the API conditions of the ISTAC legal notice.'
tags:
- tourism
- air-transport
- canary-islands
- istac
- sdmx
- airports
- official-statistics
schema:
