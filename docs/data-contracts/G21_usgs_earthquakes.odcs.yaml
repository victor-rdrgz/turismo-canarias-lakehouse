apiVersion: v3.2.0
kind: DataContract
id: 43586d01-bbe1-585f-8d8f-f18187841811
version: 0.1.0
status: draft
name: USGS earthquake catalog (FDSN event service and GeoJSON feeds)
domain: geophysics
description:
  purpose: Earthquake events worldwide (time, location, depth, magnitude and quality indicators), obtainable
    as real-time GeoJSON feeds (updated every minute) or by FDSN event queries with spatial/temporal filters.
  limitations: 'The GeoJSON format page lists only names and types: meaning, units and value domains of
    the properties are not defined by the producer. Interpretations such as ms epoch for time/updated,
    km for depth and the unit of mag per magType are observations or assumptions, not documented. Depth
    unit for GeoJSON output not stated (FDSN query parameters use km). Magnitude types and event types
    are not enumerated by the producer; observed magType values in the Canary sample: m, mb, mblg, md,
    ml (and mww, mwr in the global feed). FDSN states no rate limits or uptime guarantees and recommends
    the real-time GeoJSON feeds for automated applications. The feed life-cycle policy was not reviewed.
    Events are revised or deleted over time (updated, status), so repeated extraction can give different
    values; deleted events return HTTP 409 unless includedeleted is set. Sample covers only a Canary bounding
    box (289 events since 1990) and one day of the global feed; completeness of the catalogue for small
    events in the region, especially before the 2000s, is not known (mag minimum observed 0.0; 7 events
    have no magnitude). The place text is generated by the producer relative to nearby localities and
    may be in English; geographic name accuracy not verified.'
  usage: Query the FDSN event service with a bounding box for the Canary Islands and flatten features[].properties
    and geometry.coordinates; use updated/status to pick up revisions.
tags:
- seismology
- earthquakes
- usgs
- geojson
- fdsn
schema:
- name: earthquake_event
  logicalType: object
  physicalType: GeoJSON Feature (element of features[])
  description: 'One seismic event as a GeoJSON Feature with properties and a Point geometry. Grain: one
    event; the same id can be updated over time (updated) and events can be deleted/revised.'
  properties:
  - name: id
    logicalType: string
    physicalType: string
    description: Event identifier at feature level (documented as the feature id; built from network and
      code, e.g. net + code).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 289
    - property: observed_unique_in_sample
      value: true
    - property: json_path
      value: features[].id
    - property: observed_note
      value: equals net + code in the sample rows (e.g. us + 7000spa1)
  - name: mag
    logicalType: number
    physicalType: decimal
    description: Not defined by the producer (the GeoJSON format page lists name and type only). Documented
      as nullable-capable decimal; unit according to magType is an unverified assumption.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 2.422
    - property: observed_distinct
      value: 39
    - property: observed_unique_in_sample
      value: false
    - property: observed_min
