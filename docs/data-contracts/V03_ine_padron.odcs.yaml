    metric: duplicateValues
    description: 'Observed in sample of 810 rows on 2026-10-24; not a producer guarantee: (COD, Anyo)
      is unique. The producer declares no key.'
    arguments:
      properties:
      - COD
      - Anyo
    mustBe: 0
    dimension: uniqueness
  - type: library
    metric: nullValues
    description: 'Observed in sample of 810 rows on 2026-10-24; not a producer guarantee: Valor has no
      nulls.'
    arguments:
      properties:
      - Valor
    mustBe: 0
    dimension: completeness
  customProperties:
