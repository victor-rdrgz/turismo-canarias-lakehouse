    - property: observed_distinct
      value: 1
    - property: observed_values
      value:
      - Personas
  - name: Fecha
    logicalType: timestamp
    physicalType: string (ISO 8601 with offset)
    description: Date of the observation (documented output item 'fecha'). All observed dates are 1 January.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 3
    - property: observed_values
      value:
      - '2023-01-01T00:00:00.000+01:00'
      - '2024-01-01T00:00:00.000+01:00'
      - '2025-01-01T00:00:00.000+01:00'
  - name: T3_TipoDato
    logicalType: string
    physicalType: string
    description: Data type of the observation (documented as Tempus3 data-type identifier; friendly output
      returns the label, observed 'Definitivo').
    customProperties:
