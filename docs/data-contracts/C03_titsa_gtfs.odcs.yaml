apiVersion: v3.2.0
kind: DataContract
id: af36dc42-ad29-52dc-9ac4-3d8b791b4458
version: 0.1.0
status: draft
name: TITSA GTFS Schedule feed (Tenerife buses)
domain: mobility
description:
  purpose: 'Static GTFS Schedule feed of TITSA (Transportes Interurbanos de Tenerife) published as a ZIP
    of text files on the Cabildo de Tenerife open data portal (CKAN dataset "Información sobre el sistema
    de transporte de TITSA en Tenerife"): stops, routes, trips, stop times, service-calendar exceptions
    and shapes.'
  limitations: Field definitions, types and presence rules are inherited from the GTFS Schedule reference
    (gtfs.org); the producer publishes no data dictionary of its own, so required/primaryKey flags express
    the GTFS reference, not a TITSA guarantee. Only columns present in the sample are declared; optional
    GTFS fields absent from the files are not declared. The sample ZIP has no calendar.txt, feed_info.txt
    or transfers.txt. Update periodicity, calendar validity policy and change/versioning policy are not
    documented by the producer (CKAN metadata gives only modification dates). The original URL https://www.titsa.com/Google_transit.zip
    could not be downloaded because its TLS certificate could not be verified; the sample comes from the
    Cabildo de Tenerife CKAN resource and is assumed, not proven, to be identical. Coverage is TITSA only.
    The semantics of observed value ranges (for example IDs, calendar window) are not documented. License
    comes from CKAN metadata (cc-by); the resource itself carries no license text.
  usage: Download the ZIP and read the GTFS files as CSV (UTF-8 with BOM). Join trips to routes by route_id,
    stop_times to trips by trip_id and to stops by stop_id. Times in stop_times may exceed 24:00:00.
tags:
- gtfs
- transport
- tenerife
- titsa
- bus
