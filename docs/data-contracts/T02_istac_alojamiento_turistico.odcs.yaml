apiVersion: v3.2.0
kind: DataContract
id: d0a1eea3-49a9-5e94-8977-b2352c2a0da5
version: 0.1.0
status: draft
name: ISTAC tourist accommodation survey (C00065A_000033)
domain: tourism
description:
  purpose: 'Long-format CSV export of the ISTAC statistical dataset ISTAC/C00065A_000033 (operation C00065A, Encuesta
    de Alojamiento Turistico): open establishments, beds and rooms offered, occupancy rates by bed and by room,
    average daily rate (ADR), income per available room, total income and employment, for Canarias, its islands
    and municipalities. Declared as official statistics, monthly and annual series from 01/2009 to 09/2026, version
    2.22 (valid from 2026-10-23; next version: non-scheduled update).'
  limitations: 'Units and methodological definitions of the 13 indicators are not published in the metadata read
    (operation C00065A methodology sheet not located). The CSV column layout is not formally specified by the producer;
    the column-to-dimension mapping is inferred from column names that match documented dimensions and attributes.
    Only one accommodation category (_T, Total) is documented and observed. The sample is a selection of periods
    (2009-2010 and 2018-2026), not the full dataset (140,530 observations in the full cube). The meaning of an empty
    OBS_VALUE is only partially documented through the status (O) and confidentiality (C) attributes. No publication
    calendar documented. License: the Aviso Legal cites reuse under Ley 37/2007 with attribution; no named license.'
  usage: Raw landing of tourist accommodation indicators for Canarias (Bronze). Keep the granularity of TIME_PERIOD_CODE
    (month vs year) and the status/confidentiality flags when modelling.
tags:
- istac
- tourism
- accommodation
- canarias
- official-statistics
- sdmx
schema:
