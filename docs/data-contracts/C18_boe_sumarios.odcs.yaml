apiVersion: v3.2.0
kind: DataContract
id: 9824ae23-04cb-52ea-b0d1-faf95fc74412
version: 0.1.0
status: draft
name: BOE open data API - daily summary (sumario)
domain: legal
description:
  purpose: 'REST API of the Agencia Estatal Boletin Oficial del Estado that returns the daily summary (sumario) of the BOE
    for a date: sections, departments, optional epigraphs and items (provisions and announcements) with titles and links to
    PDF, HTML and XML. Output JSON or XML according to the Accept header. This contract covers the BOE summary endpoint /datosabiertos/api/boe/sumario/{fecha};
    consolidated legislation and BORME endpoints exist but were not sampled.'
  limitations: |-
    - Sample covers 8 issues (2010-01-04, 2015-01-02, 2020-01-02, 2025-01-02, 2026-10-21 to 2026-10-24), 1,499 items; it is not the full history and not all section/department combinations.
    - JSON shape is irregular: single child nodes appear as objects, multiple as arrays; 'item' and 'departamento' vary; a 'texto' wrapper appears in some departamento nodes; none of this is explained in the technical PDF (dated 28 Jun 2024).
    - Numeric fields documented as NUMBER arrive as JSON strings; departamento codigo is documented as 4 digits but 3-digit values appear.
    - Error responses (e.g. 404 for dates without an issue) are returned as XML even with Accept: application/json (observed).
    - No SLA, rate limit, update time of day or versioning policy is published for this API; the PDF is the only versioned document. Access may be suspended without notice for terms breaches (legal notice, Quinta.5).
    - Documented type table for the item node is partially garbled in the PDF text; lengths in this contract come from the producer documentation as extracted and may need re-checking against the XSD.
    - Titles may mention persons (e.g. appointments, notarial announcements); no personal data is reproduced in this contract.
    - Content is a summary index: it does not include provision text; the legal text must be fetched from the HTML/XML links (not sampled).
  usage: 'One request per publication date (AAAAMMDD) with Accept: application/json; handle missing dates (404) and Sunday/holiday
    gaps; normalise object-or-array nodes and the departamento.texto wrapper before loading. Cite ''Fuente de los datos: Agencia
    Estatal Boletin Oficial del Estado'' per the legal notice.'
tags:
- legal
- boe
- official-gazette
- spain
- json-api
- daily
schema:
- name: sumario_response
  logicalType: object
  physicalType: json
  description: Envelope of the API response (status plus data.sumario). In the XML variant the root is 'response'.
  properties:
  - name: status.code
    logicalType: string
    physicalType: string
    description: 'Result code of the operation: 200 ok; 400 invalid identifier or parameters; 404 requested information does
      not exist; 403 non-GET methods.'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_values
      value:
      - '200'
      - '404'
    - property: note
      value: 'Observed: 404 for a Sunday (no issue) returned an XML body even though Accept: application/json was sent.'
  - name: status.text
    logicalType: string
    physicalType: string
    description: Short message with the meaning of the result code.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_values
      value:
      - ok
      - La información solicitada no existe
  - name: data.sumario
    logicalType: object
    physicalType: object
    description: Single sumario node holding metadatos and diario [1..n]; diario has more than one occurrence only when an
      extraordinary issue is published in addition to the usual one.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_note
      value: diario was always an array with one element in the 8 sampled issues.
- name: sumario_item_flat
