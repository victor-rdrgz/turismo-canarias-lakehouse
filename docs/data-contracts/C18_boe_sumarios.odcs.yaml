    logicalType: date
    physicalType: string (JSON string, yyyyMMdd)
    description: Publication date of the daily issue in ISO 8601 AAAAMMDD; matches the date requested in the call.
    required: true
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 8
    - property: observed_unique_in_sample
      value: false
    - property: source_path
      value: data.sumario.metadatos.fecha_publicacion
    - property: documented_cardinality
      value: '[1..1]'
    - property: documented_example
      value: '20240529'
    - property: documented_date_format
      value: yyyyMMdd
    logicalTypeOptions:
      format: yyyyMMdd
  - name: publicacion
