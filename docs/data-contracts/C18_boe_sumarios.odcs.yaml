    (at epigrafe level and at departamento level); departamento may be an object instead of an array; some departamento nodes
    wrap their content under a ''texto'' key (6 of 326 in the sample); the response for a non-existent date (404) is XML.
    The flat schema was produced by normalising these variants.'
