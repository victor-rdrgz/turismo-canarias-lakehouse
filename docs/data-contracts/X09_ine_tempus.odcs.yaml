apiVersion: v3.2.0
kind: DataContract
id: bd320502-5c97-5383-a075-4522c23e35b3
version: 0.1.0
status: draft
name: INE Tempus API (JSON)
domain: statistics
description:
  purpose: 'Tempus API of the Instituto Nacional de Estadística (INEbase): REST functions under https://servicios.ine.es/wstempus/js/{language}/{function}/{input}
    returning JSON for operations, series, tables and data (for example IPC, Frontur, Egatur). Sampled
    functions: DATOS_SERIE (series IPC251852), OPERACIONES_DISPONIBLES and SERIES_OPERACION (operation
    FR).'
  limitations: The API page describes outputs only in prose; JSON field names, types, nullability and
    enumerations are observed from real responses. Tables for FK_Unidad, FK_Escala, FK_TipoDato and FK_Periodicidad
    ids were not extracted, so the meaning of the codes is unverified. Date unit (apparent epoch milliseconds)
    is undocumented. The page states a maximum of 500 elements per page for OPERACIONES_DISPONIBLES, VARIABLES,
    VARIABLES_OPERACION and SERIES_OPERACION, but SERIES_OPERACION/FR?page=1 returned 10000 elements in
    the sample, contradicting it. No rate limits, quotas, error codes, SLA, update calendar or versioning
    policy were found. The API page footer states CC BY-SA 4.0 for the website while linking to CC BY
    4.0; the legal notice (aviso legal) authorises reuse citing INE as source. The CSV (jaxiT3) outputs
    and DATOS_TABLA were not sampled. The Canarias-specific Frontur/Egatur series were not downloaded;
    only the operation-level series list (first page) was. The response of the main series ends at December
    2025 although sampled in October 2026; whether this is the latest release is unverified.
  usage: GET the function URL with optional parameters (nult, det, tip, date, p, page). Cite INE as source
    and include the update date when shown.
tags:
- ine
- statistics
- ipc
- tourism
- api
schema:
- name: serie_header
  logicalType: object
  physicalType: JSON object (top level of DATOS_SERIE response)
  description: Series metadata returned at the top level of the DATOS_SERIE function. The API page describes
    the output only in prose (series name, unit id, scale id, then the data) and does not name the JSON
    fields.
  customProperties:
  - property: observed_rows_in_sample
    value: 1
  properties:
  - name: COD
    logicalType: string
    physicalType: string
    description: Series code (Tempus identifier of the series). Not defined by the producer by name on
      the API page.
    customProperties:
    - property: evidence
      value: observed
    - property: observed_value_in_sample
      value: IPC251852
  - name: Nombre
    logicalType: string
    physicalType: string
    description: Name of the series (documented in prose as the series name).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value_in_sample
      value: Nacional. Índice general. Índice.
  - name: FK_Unidad
    logicalType: integer
    physicalType: number
    description: Tempus identifier of the unit of measure (documented in prose).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value_in_sample
      value: 133
  - name: FK_Escala
    logicalType: integer
    physicalType: number
    description: Tempus identifier of the scale (documented in prose).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value_in_sample
      value: 1
  - name: Notas
    logicalType: array
    physicalType: array of object
    description: 'Not defined by the producer. Observed: array of objects with keys texto, Fk_TipoNota,
      textoTipo.'
    customProperties:
    - property: evidence
      value: observed
    - property: observed_value_in_sample
      value: 1 note object
  - name: Data
    logicalType: array
    physicalType: array of object
    description: Array of observations of the series (documented in prose).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value_in_sample
      value: 120 elements with nult=120
