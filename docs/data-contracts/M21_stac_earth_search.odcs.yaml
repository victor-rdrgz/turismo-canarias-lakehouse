apiVersion: v3.2.0
kind: DataContract
id: 5f0b89f2-c35a-5651-97d9-0cb8f79810e5
version: 0.1.0
status: draft
name: Earth Search STAC API (Element 84)
domain: earth-observation
description:
  purpose: 'Earth Search by Element 84: public STAC API (v1) over open satellite imagery on AWS, including Sentinel-2
    L2A, Sentinel-2 L1C, Sentinel-1 GRD, Landsat C2 L2, Copernicus DEM and NAIP, with assets stored as cloud-optimized
    GeoTIFF (COG) and JP2 on S3. The sample covers the collections list and Sentinel-2 L2A items intersecting a
    bounding box around the Canary Islands.'
  limitations: 'The catalog is self-describing (STAC 1.0.0 plus extensions); there is no producer data dictionary
    for item properties (s2:*, earthsearch:*, etc. are not defined in the pages read). Only sentinel-2-l2a items
    were sampled (150 items in two query windows: 2017-06-01 to 2017-08-31 and 2026-09-01 to 2026-10-24); other
    collections'' items were not sampled. No SLA (the research notes mention a best-effort public service), no publication
    cadence, no catalog/API license beyond the collection license link to the Sentinel data legal notice (collection
    license field is ''proprietary''). Some assets live in a different bucket (s3://sentinel-s2-l2a) and may be
    requester-pays: not verified. Known missing items in some collections are mentioned in the repository README
    (not read in this pass). Pagination was not followed beyond the first page of each query (matched 477 and 167
    items).'
  usage: Discover Sentinel-2 L2A scenes over the Canary Islands (bbox, datetime, eo:cloud_cover) and fetch COG assets
    by href.
tags:
- stac
- sentinel-2
- earth-observation
- aws-open-data
- canarias
- api
schema:
- name: stac_collection
