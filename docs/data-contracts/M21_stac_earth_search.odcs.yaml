    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
    - property: observed_present_pct
      value: 100.0
  - name: id
    logicalType: string
    physicalType: string
    description: Collection identifier.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_present_pct
      value: 100.0
  - name: title
    logicalType: string
    physicalType: string
    description: Collection title.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_present_pct
      value: 100.0
  - name: description
    logicalType: string
    physicalType: string
    description: Collection description.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_present_pct
      value: 100.0
  - name: stac_version
    logicalType: string
    physicalType: string
