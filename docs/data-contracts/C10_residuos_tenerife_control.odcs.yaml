apiVersion: v3.2.0
kind: DataContract
id: e31f26ae-359b-5c4c-89e7-40daedf3af3c
version: 0.1.0
status: draft
name: Waste management in Tenerife (weighing control of waste entries)
domain: environment
description:
  purpose: 'Records of waste received at Tenerife facilities (weighing control): municipality and postal
    code of the depositor, facility, European waste code (LER) and name, type of depositor, date and weight
    in tonnes.'
  limitations: 'The data dictionary lists names, text/numeric types and meanings, but no key, valid-value
    lists (other than True/False), null handling, update policy or change policy. The yearly files are
    only partially sampled (first 8 MB each of 2023 and 2010); years 2011-2022 not sampled, so schema
    drift across years is unverified. In the 2010 sample the date field (fecha) is empty in every row,
    so the 2010 file cannot be placed in time from its contents; whether other early years are the same
    is unknown. The CKAN frequency says Monthly, but the original record was last modified 2025-02-20
    and only years up to 2023 are listed; the real update cadence is not verified (SLA frequency below
    is the declared one, not verified). Timezone of fecha not documented. Units: peso_vertido in tonnes
    (documented). tipo_vertido_id is typed text but values look numeric; leading zeros of LER codes not
    verified. Postal code is typed numeric by the producer. Rows lack an identifier: the same (municipality,
    plant, waste type, date, weight) combination appears more than once, and whether that denotes duplicates
    or distinct weighings is not documented. Personal data: the records identify companies/organisations
    by municipality and postal code only; no names observed.'
  usage: Union the yearly CSV files and load them as one table, keeping the year of the source file because
    fecha may be empty; apply the data dictionary types explicitly.
tags:
- waste
- tenerife
- cabildo
- ler
