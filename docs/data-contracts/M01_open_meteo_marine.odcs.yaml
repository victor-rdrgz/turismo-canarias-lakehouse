apiVersion: v3.2.0
kind: DataContract
id: 1fbb7d7d-241d-5e13-84da-7c03b369622b
version: 0.1.0
status: draft
name: Open-Meteo Marine API hourly forecast and model data
domain: environment
description:
  purpose: 'Open-Meteo Marine Weather API (v1): hourly wave, swell, ocean-current, sea-surface-temperature and sea-level variables
    for a latitude/longitude, computed from global marine models (e.g. DWD, ECMWF, NOAA/GFS, Meteo-France, ERA5-Ocean) with
    ''Best match'' model selection by default. Response is a JSON object with location metadata and columnar hourly arrays.
    Daily and 15-minutely variants exist but were not sampled.'
  limitations: |-
    - Model output (forecast/reanalysis), not in-situ measurements; the model that served each value is not identified in the response.
    - Documentation inconsistencies: forecast_days default stated as 5 in the parameter table and 7 elsewhere; cell_selection default stated as sea in the table and land in the text.
    - The sample (past_days=7, forecast_days=7) mixes recent past model values and forecast values; the response does not mark which rows are past or forecast.
    - Null handling is not specified; in the sample, wind_wave_peak_period, swell_wave_peak_period and the three tertiary_swell_* variables are null for all 336 hours (hourly_units reports 'undefined' for them).
    - Value ranges and nullability per variable are not documented; observed ranges are for one point and one 14-day window only.
    - Daily variables (require timezone), 15-minutely variables and current block were not sampled; documented by the producer but not sampled.
    - Multi-location responses (list of objects, CSV/XLSX with location_id) were not sampled.
    - License page (open-meteo.com/en/license) returned no readable content; license taken from the terms page. No SLA published; model update cadences not verified.
    - Changes of the Best match model over time are not traceable in the response.
  usage: One request per coordinate set; unpivot hourly arrays into rows keyed by (grid cell latitude, grid cell longitude,
    time). Provide attribution to Open-Meteo and, for DWD-based data, to DWD as the documentation requests. Free API only
    for non-commercial use.
tags:
- marine
- waves
- sea-surface-temperature
- open-meteo
- canary-islands
- hourly
- forecast
- json-api
