      value: '35001'
    - property: observed_max
      value: ES709
  - name: TIME
    logicalType: string
    physicalType: string
    description: Time dimension, monthly granularity (MONTHLY), code format YYYY-MM.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 223
    - property: observed_unique_in_sample
