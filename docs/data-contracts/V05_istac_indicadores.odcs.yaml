  description: 'Response of GET /indicators/PARO_REGISTRADO/data (all territories, all periods, all measures). JSON
    cube: dimension indexes plus flat observation and attribute arrays in the order of ''format'' [GEOGRAPHICAL,
    TIME, MEASURE]. The properties below describe the logical flattened table (derived_flat.csv) used for profiling;
    the physical JSON keys are format, dimension, observation, attribute, attributes.'
  properties:
  - name: GEOGRAPHICAL
    logicalType: string
    physicalType: string
    description: 'Territory dimension code. Documented granularities: REGIONS (ES70 Canarias), ISLANDS (ES70x),
      MUNICIPALITIES (INE-style codes such as 35004).'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
