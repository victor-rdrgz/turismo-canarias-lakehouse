      value: 2008-03
    - property: observed_max
      value: 2026-09
  - name: MEASURE
    logicalType: string
    physicalType: string
    description: 'Measure representation. Documented: ABSOLUTE (Dato, persons, 0 decimals), ANNUAL_PUNTUAL_RATE
      (Variacion anual, persons), INTERPERIOD_PUNTUAL_RATE (Variacion interperiodica, persons), ANNUAL_PERCENTAGE_RATE
      (Tasa variacion anual, %, 2 decimals), INTERPERIOD_PERCENTAGE_RATE (Tasa variacion interperiodica, %, 2 decimals).'
    customProperties:
    - property: evidence
