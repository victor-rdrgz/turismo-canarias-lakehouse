apiVersion: v3.2.0
kind: DataContract
id: 3816ea57-3278-5512-a074-5634f6769ae1
version: 0.1.0
status: draft
name: ISTAC indicators API
domain: economy
description:
  purpose: 'ISTAC indicators API (v1.0): catalog of 402 statistical indicators of Canarias (employment, tourism,
    housing, prices, etc.), indicator fiches and indicator data as cubes over GEOGRAPHICAL x TIME x MEASURE. The
    sample covers the catalog list and the full data of one indicator, PARO_REGISTRADO (registered unemployment,
    monthly 2008-03 to 2026-09, Canarias, 7 islands and municipalities).'
  limitations: 'Only 1 of 402 indicators was inspected in detail (PARO_REGISTRADO); other indicators differ in granularity,
    dimensions and measures. No global data dictionary; the meaning of fields comes from each indicator fiche. Primary
    source of the data (e.g. employment service) is not cited in what was read. Observation values are strings in
    the JSON and use ''.'' for unavailable data; their cube order is derived from the ''format'' array. The OpenAPI/Swagger
    description of the API was not read in this sample pass. No SLA, no deprecation policy. License: the Aviso legal
    cites reuse under Ley 37/2007 with attribution; no named license.'
  usage: Raw landing of ISTAC indicators; use the catalog to discover indicators and the data endpoint with GEOGRAPHICAL/TIME/MEASURE
    cubes for series.
tags:
- istac
- indicators
- employment
- canarias
- official-statistics
- api
