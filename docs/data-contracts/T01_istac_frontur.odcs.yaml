    physicalType: text
    description: Code of the dimension TIME_PERIOD (Periodo). SDMX monthly period code (YYYY-Mnn). The dataset metadata declares
      200 periods, 2010-M01 to 2026-M08 (version 1.64).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 111
    - property: observed_unique_in_sample
