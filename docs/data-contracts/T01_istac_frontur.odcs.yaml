apiVersion: v3.2.0
kind: DataContract
id: 8ab890cf-c66d-5f92-9f39-9b737c2f0bb6
version: 0.1.0
status: draft
name: ISTAC FRONTUR-Canarias tourists by residence and traveller type (monthly, by island)
domain: tourism
description:
  purpose: 'Statistical cube E16028B_000011 of the Canary Islands Statistics Institute (ISTAC), operation E16028B (Estadistica
    de Movimientos Turisticos en Fronteras de Canarias, methodology 2016): number of tourists visiting the Canary Islands
    by place of residence and traveller type (tourists, main tourists, secondary tourists), by island and month, with annual
    and inter-period variations and rates. Published through the ISTAC statistical-resources API (SDMX-based); this contract
    describes the CSV representation of the latest version (v1.64 when sampled).'
  limitations: |-
    - The producer publishes no per-column data dictionary beyond SDMX dimension/attribute names and codelists; CSV column names (including the #es label columns and OBS_VALUE) are described from the metadata and the sample.
    - Units per indicator (UNIDAD_MEDIDA, MULTIPLICADOR_UNIDAD) and the collection period (PERIODO_RECOGIDA) are declared as attributes but not exported in the CSV and their values were not read.
    - Values of CONFIDENCIALIDAD_OBSERVACION are unknown (empty in every sampled row); only the status code M (missing value, data does not exist) and one annotation text (estimate based on fewer than 20 sample observations) are observed.
    - Many OBS_VALUE cells are empty without an observation status; the reason is not documented.
    - The cube covers five islands only (La Gomera and El Hierro are not declared).
    - The ~latest alias moves with each version (v1.64 replaces v1.63, minor data update, next version NON_SCHEDULED_UPDATE); values and the period range change over time.
    - Sibling cubes E16028B_000001 to _000016 (age, reason, accommodation, forecasts) were not sampled.
    - No SLA, availability guarantee, deprecation policy or formal quality/not-null/uniqueness rules were found; the legal notice states that ISTAC does not guarantee accuracy, completeness or continuity. The full CSV is about 27 MB, above the sample cap, so the contract sample holds a subset of periods.
  usage: 'Download the CSV via the ~latest alias or pin the version in the URL. Read all columns as strings and cast OBS_VALUE
    explicitly (the CSV has no typing). Cite ''Fuente: Instituto Canario de Estadistica (ISTAC)'' and respect the API conditions
    of the ISTAC legal notice.'
tags:
- tourism
- canary-islands
- istac
- sdmx
- frontur
- monthly
- official-statistics
schema:
