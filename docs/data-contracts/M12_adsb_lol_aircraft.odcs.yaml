apiVersion: v3.2.0
kind: DataContract
id: 111306c5-de93-56ce-ae66-6e7f6de5e3ad
version: 0.1.0
status: draft
name: adsb.lol real-time aircraft (v2 point query)
domain: mobility
description:
  purpose: Real-time ADS-B aircraft state reports (identification, position, altitude, speed, heading,
    integrity indicators) returned by the community adsb.lol API for a circle around a point, in readsb
    tar1090 JSON format.
  limitations: 'Field descriptions and units come from the readsb README-json, not from adsb.lol, which
    publishes only names and types in its OpenAPI; assuming adsb.lol follows readsb is plausible but not
    declared. Unit of ''now'' for adsb.lol is not documented (readsb: seconds; the sample is consistent
    with milliseconds). ctime, ptime, msg, total are not described. Possible values of ''type'', ''emergency''
    and ''category'' are from readsb only; the sample shows a single type value (adsb_icao). No SLA, update
    frequency, availability or retention is documented; a rate-limit header was observed but is not documented.
    Terms of use for production are not defined (the producer asks to be contacted). Keys are omitted
    when data is missing, so null and absent cannot be told apart in the profile. The profiler loads JSON
    via pandas, so observed integer fields with missing values appear as numbers in profile.json although
    the raw JSON uses integers. Snapshot has no history: coverage over time, flights over the Canary Islands
    per day and database fields (r, t, dbFlags) completeness are not known. Aircraft identifiers (hex,
    registration, callsign) are public ADS-B broadcast data but are not shown as examples here.'
  usage: Query GET /v2/point/{lat}/{lon}/{radius} (radius max 250 nm) and flatten the ac array; the response
    is a point-in-time snapshot, so history must be built by repeated polling within the producer's usage
    limits.
tags:
- aviation
- ads-b
- real-time
- adsb-lol
schema:
