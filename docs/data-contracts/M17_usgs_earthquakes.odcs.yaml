apiVersion: v3.2.0
kind: DataContract
id: ad62378c-ed0c-5ec8-a0b2-b442d01a4f7c
version: 0.1.0
status: draft
name: USGS earthquake GeoJSON feeds
domain: hazards
description:
  purpose: 'Earthquake events published by the USGS as GeoJSON FeatureCollections: real-time summary feeds
    (https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/*.geojson) and the FDSN event web service
    (https://earthquake.usgs.gov/fdsnws/event/1/query, formats geojson, csv, quakeml and others). The
    producer recommends the real-time GeoJSON feeds for automated applications.'
  limitations: The GeoJSON format page documents field names and types only; it gives no definitions,
    units, nullability or allowed values for any property (status, alert, magType, type, tsunami, sig,
    time units are all undefined there). Observed values are listed only as observed. Time unit (apparent
    epoch milliseconds) is not documented. Events can be updated or deleted after publication (field updated;
    FDSN includedeleted parameter exists but was not exercised). FDSN limit is 1-20000 and larger result
    sets return HTTP 400; default format is QuakeML. No SLA and no license page for the API were read
    beyond the general USGS copyright statement. The sample is global (past-day feed); the Canary Islands
    bounding-box query (lat 27..30, lon -19..-13, 2016-01-01..2026-10-24) returned only 7 events, so Canarias
    coverage in this catalogue is thin and its completeness vs the local IGN network is unknown. The feed
    life cycle policy page was not read. Contract covers the GeoJSON representation only; CSV and QuakeML
    are not described.
  usage: Poll the real-time feed (Cache-Control max-age 60 observed in prior research, not re-verified)
    or query FDSN with starttime/endtime/bbox/limit; key on feature id and handle later updates via the
    updated field.
tags:
- earthquakes
- seismology
- geojson
- usgs
- hazards
