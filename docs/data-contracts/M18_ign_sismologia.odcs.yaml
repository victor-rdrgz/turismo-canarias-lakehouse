version: 0.1.0
status: draft
name: IGN seismology GeoRSS feed
domain: seismology
description:
  purpose: RSS 2.0 / GeoRSS feed of the Instituto Geográfico Nacional listing recent earthquakes in Spain (last
    ten days) with epicentre coordinates.
  limitations: 'The producer publishes no field dictionary for this feed; item fields are observed only. The feed
    covers the whole of Spain and neighbouring seismic zones, not only the Canary Islands (Canary Islands events
    must be filtered, e.g. by coordinates or by region names such as ''ATLÁNTICO-CANARIAS'' observed in the description).
    Magnitude, region, event date-time and coordinates are only available as free text inside item/description (geo:lat
    and geo:long are separate elements). Magnitude type, depth, intensity, time zone of the dates, update frequency
    and revision policy are not documented. There is no pubDate or event identifier element: the event id appears
    only inside the link/guid URL (evid parameter). Only a 20-item snapshot was taken. Licence was not read on the
    producer''s page (the source registry lists CC BY 4.0 IGN España, unconfirmed here).'
  usage: Poll the feed and keep new events; filter to the Canary Islands area downstream.
tags:
- seismology
- earthquakes
- georss
- ign
- canary-islands
schema:
- name: channel
  logicalType: object
  physicalType: xml-element
  description: RSS 2.0 channel header of the IGN seismology feed.
  properties:
  - name: title
    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
  - name: link
    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
  - name: description
    logicalType: string
    physicalType: string
    description: 'Channel text published by the producer: lists earthquakes in Spain during the last ten days; the
      information is subject to modification due to continuous revision of the seismic analysis (paraphrased from
      the feed).'
    customProperties:
    - property: evidence
      value: documented+observed
  - name: language
    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
  - name: dc:language
    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
