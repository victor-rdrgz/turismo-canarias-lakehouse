apiVersion: v3.2.0
kind: DataContract
id: a1931a6a-7c44-5c3b-bb3d-f59b55414b03
version: 0.1.0
status: draft
name: iNaturalist API v1 - Observations (Canary Islands bounding box)
domain: biodiversity
description:
  purpose: Citizen-science species observations (location, time, taxon, quality grade, media, identifications) from
    the public iNaturalist API v1, requested here for a bounding box around the Canary Islands.
  limitations: 'Property definitions in the swagger carry names and types only, with no descriptions, units or value
    lists; most descriptions are therefore ''Not defined by the producer''. Units of positional_accuracy/public_positional_accuracy
    are not defined (NOT VERIFIED). geoprivacy and taxon_geoprivacy values are not enumerated; coordinates may be
    obscured or hidden according to the observer''s settings. License is per observation (license_code, null when
    none) and per photo (depends on the photo domain); the API is not under a single licence. Throttle: max 100
    requests/minute (60/minute and under 10,000/day requested); blocks may happen without notice; the API is intended
    for applications, not data scraping; bulk exports are on the developers page. The sample is only the 600 most
    recent observations by id (order_by=id desc, 3 pages of 200) inside the bounding box swlat=27.5, swlng=-18.5,
    nelat=29.5, nelng=-13 of a total of 585759 at request time; 5 pages were fetched and 2 discarded because the
    total exceeded the 25 MB limit. The box also covers sea and part of Africa-adjacent waters; its relation to
    Canarias boundaries is not verified. Nested objects (taxon, user, photos, identifications, comments...) are
    modelled to the first level only. The response contains personal data of observers (login, name, icon); the
    raw sample is kept outside the repository and contract examples exclude those values. Documented fields not
    seen in the sample: id_please, out_of_range, private_geojson, private_location, private_place_guess, private_place_ids,
    verifiable. Observed fields not in the swagger: observation_sounds. No SLA, no deprecation policy; swagger version
    1.3.0.'
  usage: Raw landing of /v1/observations pages; flatten results[] to one row per observation; respect per-observation
    licence_code and attribution when reusing; keep personal fields out of public layers.
tags:
- biodiversity
- species
- citizen-science
- canarias
- api
- json
