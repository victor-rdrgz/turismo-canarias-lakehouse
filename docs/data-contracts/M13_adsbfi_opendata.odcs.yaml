apiVersion: v3.2.0
kind: DataContract
id: 56a7ad5d-d8e8-5776-9ba6-0426ad1d2e86
version: 0.1.0
status: draft
name: adsb.fi open data - aircraft near the Canary Islands
domain: mobility
description:
  purpose: Real-time ADS-B aircraft state vectors within a radius of a point, from the adsb.fi community
    network open data API (readsb-style JSON).
  limitations: 'Single snapshot of 27 aircraft taken on 2026-10-24 with the v3 radius endpoint (center
    28.0,-15.4; radius 100 NM); no time series. adsb.fi publishes no field dictionary: field descriptions
    are taken from the readsb documentation on the assumption of compatibility, which adsb.fi states only
    as ADSBexchange v2 compatibility. Keys are omitted when data is unavailable, so null percentages count
    absent keys. Fields r, t, desc, dbFlags depend on a server-side database; only r, t and desc were
    seen (desc absent for 2 aircraft). Keys msg and ctime are not documented. The batch''s known URL used
    the v2 radius endpoint, which adsb.fi marks deprecated (different format); the v3 endpoint was sampled
    instead. No SLA; service provided as-is and may be suspended. Public endpoint rate limit: 1 request
    per second; 400/401/403/404/429 responses count toward a temporary IP restriction. Terms: personal,
    non-commercial use only; the data may not be licensed, sold, rented or leased; adsb.fi must be cited
    with a link to its home page. This may conflict with a public portfolio: do not republish the raw
    data. Refresh frequency of the public endpoint is not declared.'
  usage: Query the v3 radius endpoint no faster than once per second; for personal non-commercial use
    with attribution to adsb.fi (https://adsb.fi).
tags:
- adsb
- aviation
- real-time
- canary-islands
schema:
- name: snapshot_envelope
  logicalType: object
  physicalType: json object (response root)
  description: 'Response root of the radius query: aircraft array plus snapshot metadata.'
  properties:
  - name: msg
    logicalType: string
    physicalType: string
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
    - property: observed_values
      value:
      - No error
  - name: now
    logicalType: integer
    physicalType: integer
    description: Time the data was generated since the Unix epoch. readsb states milliseconds for the
      jv2 syntax; the value observed (1792839048001) is consistent with milliseconds.
    customProperties:
    - property: evidence
      value: documented+observed
  - name: total
    logicalType: integer
    physicalType: integer
    description: Number of aircraft in the aircraft array (readsb jv2 syntax).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value
      value: 27
  - name: ctime
    logicalType: integer
    physicalType: integer
    description: Not defined by the producer
    customProperties:
    - property: evidence
      value: observed
    - property: observed_value
      value: 1792839048001
  - name: ptime
    logicalType: integer
    physicalType: integer
    description: Time in milliseconds it took to parse the request and create the JSON output (readsb).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value
      value: 0
  - name: ac
    logicalType: array
    physicalType: array of object
    description: Array of aircraft objects. Keys are omitted when data is not available (readsb). The
      key name 'ac' is not documented by adsb.fi in the pages read.
    customProperties:
    - property: evidence
      value: observed
- name: aircraft_state
  logicalType: object
  physicalType: json object inside array 'ac'
  description: 'One aircraft state vector at the instant of the snapshot (grain: one object per aircraft;
    hex is unique within one snapshot per readsb convention).'
  properties:
  - name: hex
    logicalType: string
    physicalType: string
    description: Field description comes from the readsb JSON documentation (adsb.fi states its responses
      are compatible with the ADSBexchange v2 API, which readsb implements); adsb.fi itself publishes
      no field dictionary. 24-bit ICAO identifier of the aircraft as 6 hex digits; may start with '~'
      for non-ICAO addresses.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 27
    - property: observed_unique_in_sample
      value: true
    - property: observed_null_pct_meaning
      value: percentage of aircraft objects where the key was absent
  - name: type
    logicalType: string
    physicalType: string
    description: Field description comes from the readsb JSON documentation (adsb.fi states its responses
      are compatible with the ADSBexchange v2 API, which readsb implements); adsb.fi itself publishes
      no field dictionary. Type of underlying messages / best source of the current data (e.g. adsb_icao,
      mlat, tisb_icao, mode_s).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 1
    - property: observed_values
      value:
      - adsb_icao
    - property: observed_null_pct_meaning
      value: percentage of aircraft objects where the key was absent
  - name: flight
    logicalType: string
    physicalType: string
    description: Field description comes from the readsb JSON documentation (adsb.fi states its responses
