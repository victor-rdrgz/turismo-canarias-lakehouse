      - '2020'
      - '2021'
      - '2022'
      - '2023'
      - '2024'
  - name: Valor
    logicalType: number
    physicalType: float
    description: 'Value of the data point (DATOS_SERIE output: ''value''). For this series the unit is
      ''Indice'' (FK_Unidad 133, from the UNIDADES list); the base period is not documented here (value
      100.0 is observed for 2015).'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 14
    - property: observed_unique_in_sample
      value: true
    - property: observed_min
      value: 99.33
    - property: observed_max
      value: 124.014
  - name: Secreto
    logicalType: boolean
    physicalType: boolean
    description: Not defined by the producer (the API documentation page does not describe this field).
    customProperties:
    - property: evidence
      value: observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 1
    - property: observed_unique_in_sample
      value: false
    - property: observed_values
      value:
      - 'False'
  quality:
  - type: text
    description: 'Observed in sample of 14 rows on 2026-10-24; not a producer guarantee: (Fecha) and Anyo
      are unique per data point; Valor has no empty values; all rows have FK_TipoDato=1, FK_Periodo=28
      and Secreto=false.'
  - type: text
    description: 'Observed in sample; not a producer guarantee: one data point per year for 2011-2024
      with no gaps.'
