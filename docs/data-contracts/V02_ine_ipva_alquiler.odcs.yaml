    logicalType: integer
    physicalType: long
    description: 'Date of the data point (DATOS_SERIE output: ''date''). Observed as milliseconds since
      the Unix epoch, always 1 January at local midnight (e.g. 1293836400000 = 2010-12-31T23:00:00Z);
      the unit is not documented.'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 14
    - property: observed_unique_in_sample
      value: true
    - property: observed_min
      value: 1293836400000.0
    - property: observed_max
      value: 1704063600000.0
    - property: observed_interpretation
      value: ms epoch
  - name: FK_TipoDato
    logicalType: integer
    physicalType: integer
    description: 'Identifier of the data type (DATOS_SERIE output: ''data type identifier''). Meaning
      of value 1 not looked up.'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 1
    - property: observed_unique_in_sample
      value: false
    - property: observed_min
