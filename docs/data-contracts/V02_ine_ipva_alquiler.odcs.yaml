    - property: observed_max
      value: 28.0
    - property: observed_values
      value:
      - '28'
  - name: Anyo
    logicalType: integer
    physicalType: integer
    description: 'Year of the data point (DATOS_SERIE output: ''year'').'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
