version: 0.1.0
status: draft
name: INE Rental housing price index (IPVA) via Tempus3 API
domain: housing
description:
  purpose: 'Rental housing price index (Indice de Precios de Vivienda en Alquiler) published by INE through
    the Tempus3 JSON API: series data points, series metadata and the list of tables of the operation.'
  limitations: The API documentation describes the response in prose only; Secreto, Data and COD are not
    defined. The meaning of FK_TipoDato=1, FK_Periodo=28, FK_Clasificacion=50 and FK_Escala=1 was not
    looked up. Index base (2015=100 is only observed from the value 100.0 in 2015, and table codes start
    with 2015) is not documented here. The methodology of the IPVA (sources, coverage, treatment) was
    not located in this review. The last data point is 2024 although the table metadata shows a modification
    on 2026-05-11; the publication calendar and revision policy are not verified. No rate limit or SLA
    documented. Licence for the API data is not explicitly stated (site footer says CC BY-SA 4.0). Only
    one series was sampled; a Canarias series by building type, size or contract age and the provincial
    series (islands are not a level in the sampled tables) are not verified. DATOS_SERIE without the nult
    parameter returned 404; use nult or date parameters.
  usage: Call DATOS_SERIE/{COD}?nult=N for the data of a series (e.g. IPVA4947 = Canarias, Total, Index)
    and SERIE/{COD} for metadata; resolve lookup identifiers via UNIDADES and PERIODICIDADES.
tags:
- housing
- rent
- price-index
- ine
- tempus3
schema:
