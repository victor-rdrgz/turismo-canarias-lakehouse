apiVersion: v3.2.0
kind: DataContract
id: eb6033fe-0d81-57b0-9055-2b75b84ff36a
version: 0.1.0
status: draft
name: Canary Islands government open-data CKAN catalogue (excluding ISTAC)
domain: open-data-catalogue
description:
  purpose: 'Metadata catalogue of the Canary Islands open-data portal (datos.canarias.es, CKAN) read through the CKAN Action
    API v3 action package_search. The portal lists 23498 datasets of which 22880 belong to ISTAC (covered by other contracts);
    this contract covers the other 618 (cabildo de Tenerife / ecit, territorial policy, public administrations, energy, agriculture,
    GRAFCAN, tourism, health, among others): one record per dataset with licence, publisher, DCAT-style extras and nested
    resources (files or services in CSV, JSON, GeoJSON, ZIP, API and other formats).'
  limitations: |-
    - CKAN documents package_search parameters and the response envelope (count, results, facets, search_facets) but not the per-field content of a dataset or resource; the portal publishes no metadata profile, so every dataset/resource field is described as 'Not defined by the producer' and is observed only.
    - Vocabularies of extras.frequency and extras.theme, the meaning of harvest_* extras and the Unit of resource.size are undocumented.
    - The catalogue changes continuously (datasets modified up to the sampling day); counts, ids and modification dates are a snapshot.
    - CKAN states that unversioned API calls may change across upgrades and recommends pinning /api/3/ (used here); the facets key is deprecated.
    - Search facets were not requested in the sample, so result.search_facets and result.facets are empty.
    - Licence varies per dataset (cc-by, gobcan-aviso-legal, sitcan-aviso-legal, cieh-aviso-legal); each must be checked before reuse. The data referenced by resource URLs was not downloaded and is out of scope of this contract.
    - No SLA, no update schedule (some datasets declare their own extras.frequency) and no formal quality rules were found.
  usage: 'Query package_search with fq=-organization:istac and rows<=1000, paging with start; use sort=id asc (or another
    stable key) for reproducible paging. Read nested lists (extras, groups, tags, resources) as JSON arrays. Check the per-dataset
    licence and cite ''Fuente: Gobierno de Canarias'' (or the dataset''s own organisation) as the portal''s legal notice asks.'
tags:
- open-data
- catalogue
- ckan
- canary-islands
- metadata
- dcat
schema:
- name: ckan_package_search_response
  logicalType: object
  physicalType: json
  description: Envelope of the CKAN Action API v3 package_search response (JSON).
  properties:
  - name: success
    logicalType: boolean
    physicalType: boolean
    description: Success flag of the CKAN action response. Not described in the CKAN package_search documentation read.
    customProperties:
    - property: evidence
      value: observed
    - property: observed_values
      value:
      - true
  - name: help
    logicalType: string
    physicalType: string
    description: URL to the action help. Not described in the CKAN package_search documentation read.
    customProperties:
    - property: evidence
      value: observed
  - name: result.count
    logicalType: integer
    physicalType: integer
    description: Total number of matching datasets (not the number returned), per CKAN documentation.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_values
      value:
      - 618
  - name: result.results
    logicalType: array
    physicalType: array of objects
    description: List of dictized datasets ordered by sort (object ckan_package), per CKAN documentation.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_length
      value: 618
  - name: result.facets
    logicalType: object
    physicalType: object
    description: Facet counts; marked deprecated in the CKAN documentation.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value
      value: '{}'
  - name: result.search_facets
    logicalType: object
    physicalType: object
    description: Facet info keyed by facet field, each with title and items (count, display_name, name). Empty unless facet.field
      is requested.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value
      value: '{}'
  - name: result.sort
    logicalType: string
    physicalType: string
    description: Observed key of the result object; not described in the documentation read.
    customProperties:
    - property: evidence
      value: observed
    - property: observed_value
      value: id asc
