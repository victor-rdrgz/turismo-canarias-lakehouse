apiVersion: v3.2.0
kind: DataContract
id: 7ba64937-5107-59f3-98d6-9689f9f62f27
version: 0.1.0
status: draft
name: IGN earthquakes last 10 days (GeoRSS)
domain: geoscience
description:
  purpose: IGN (Instituto Geografico Nacional) GeoRSS feed of earthquakes in Spain and nearby areas during the last
    ten days, including the Canarias region (zone name ATLANTICO-CANARIAS observed). Data are subject to revision
    according to the channel description.
  limitations: 'There is no field documentation for the feed: the meaning of each element comes from the channel
    description and element names. Time zone of event dates, magnitude type, depth and intensity are not provided
    or not stated (depth and intensity are absent from the feed). Zone names and magnitude must be parsed from free
    text. Only the last ten days are available: history requires own accumulation. Update cadence is not documented
    by the IGN for the feed (response headers observed: Cache-Control s-maxage=120, served via CloudFront). License
    not verified: the IGN catalogue page asks for the credit ''Instituto Geografico Nacional (IGN). Catalogo de
    terremotos'' and gives DOI 10.7419/162.03.2022, but no license is named; applicability to the feed is not stated.
    The datos.gob.es catalogue entry could not be read (redirected to a maintenance page). Sample is a single snapshot
    of 20 items.'
  usage: Poll the feed and accumulate events by guid/evid to build a history; parse magnitude, zone and datetime
    from description/title.
tags:
- ign
- earthquakes
- seismology
- georss
- canarias
schema:
- name: rss_channel
  logicalType: object
  physicalType: xml
  description: Channel element of the RSS 2.0 / GeoRSS document.
  properties:
  - name: title
    logicalType: string
    physicalType: string
    description: 'Channel title. Observed: ''GeoRSS Sismologia IGN''.'
    customProperties:
    - property: evidence
      value: observed
  - name: link
    logicalType: string
    physicalType: string
    description: 'Channel link. Observed: http://www.ign.es/ign/rss'
    customProperties:
    - property: evidence
      value: observed
  - name: description
    logicalType: string
    physicalType: string
    description: 'Channel description: lets you consult earthquakes in Spain during the last ten days; the information
      is subject to modification as a result of continuous review of the seismic analysis.'
    customProperties:
    - property: evidence
      value: documented+observed
  - name: language
    logicalType: string
    physicalType: string
    description: Channel language; observed 'es' (also dc:language).
    customProperties:
    - property: evidence
      value: observed
- name: rss_item_earthquake
  logicalType: object
  physicalType: xml
  description: One item per earthquake in the last ten days (RSS item with geo:lat / geo:long).
  properties:
  - name: title
    logicalType: string
    physicalType: string
    description: 'Item title. Observed pattern ''-Info.terremoto: dd/mm/yyyy h:mm:ss'' (event date-time; time zone
      NOT stated by the producer).'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 20
    - property: observed_unique_in_sample
      value: true
  - name: link
    logicalType: string
    physicalType: string
    description: Link to the event detail page in the IGN earthquake catalogue; contains evid=esYYYYxxxxx.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 20
    - property: observed_unique_in_sample
      value: true
  - name: description
    logicalType: string
    physicalType: string
    description: 'Free text. Observed template: ''Se ha producido un terremoto de magnitud M en ZONE en la fecha
      dd/mm/yyyy h:mm:ss en la siguiente localizacion: lat,lon''. Magnitude type is not stated; fields must be parsed
      from text.'
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 20
    - property: observed_unique_in_sample
      value: true
  - name: guid
