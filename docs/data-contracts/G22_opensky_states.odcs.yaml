    logicalType: string
    physicalType: string
    description: Unique ICAO 24-bit address of the transponder in hex string representation.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 25
    - property: observed_unique_in_sample
      value: true
    - property: array_index
      value: 0
  - name: callsign
    logicalType: string
    physicalType: string | null
    description: Callsign of the vehicle (8 chars). Can be null if no callsign has been received.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 25
    - property: observed_unique_in_sample
      value: true
    - property: array_index
      value: 1
  - name: origin_country
