apiVersion: v3.2.0
kind: DataContract
id: 54336eee-bf57-5b06-ad58-4e7434493bbd
version: 0.1.0
status: draft
name: OpenSky Network live aircraft states (Canary Islands bounding box)
domain: mobility
description:
  purpose: Live ADS-B / MLAT state vectors (position, altitude, velocity, identifiers) of aircraft inside
    a WGS-84 bounding box, from the OpenSky Network REST API.
  limitations: 'Single anonymous snapshot (25 state vectors) taken on 2026-10-24 for bbox lat 27..30,
    lon -19..-13; no history (anonymous access gets only the most recent state, time resolution 10 s).
    The sensors field was null in every vector (no sensor filter). category was not requested (extended=1
    needed). Credits: anonymous 400/day per endpoint bucket; a bbox of 18 sq deg cost 1 credit (X-Rate-Limit-Remaining
    399 after the request); 429 returned with X-Rate-Limit-Retry-After-Seconds when exhausted. The REST
    reference now describes OAuth2 for authenticated use; no account or token was used. The terms-of-use
    page returned HTTP 403 to the sampling client and was not read, so licence conditions are unverified
    (the catalogue note says non-commercial/research use). No SLA, no versioning policy, no quality rules
    beyond nullability. Coverage depends on community receivers; gaps are not characterised.'
  usage: Call GET /states/all with lamin, lomin, lamax, lomax; respect credit quotas; check terms of use
    before any reuse.
tags:
- opensky
- aviation
- real-time
- canary-islands
schema:
- name: states_response
  logicalType: object
  physicalType: json object (response root)
  description: Response root of GET /states/all.
  properties:
  - name: time
    logicalType: integer
    physicalType: int
    description: The time which the state vectors in this response are associated with; each vector represents
      the state within the interval [time - 1, time].
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_value
      value: 1792854191
  - name: states
    logicalType: array
    physicalType: array of state vector arrays
    description: The states property is a two-dimensional array; each row is a state vector. May be null
      when no aircraft match (not observed).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_length
      value: 25
- name: state_vector
  logicalType: object
  physicalType: json array of 17 positional elements (element of 'states')
  description: 'State vector of one aircraft at the snapshot instant. Positional array: the property order
    follows the documented index. Grain: one vector per aircraft per response.'
