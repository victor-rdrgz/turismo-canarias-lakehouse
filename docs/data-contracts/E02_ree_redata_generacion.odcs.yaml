apiVersion: v3.2.0
kind: DataContract
id: 8eea9462-5acd-5576-a6c7-823eb96f99c7
version: 0.1.0
status: draft
name: REE REData generation and balance (Canarias)
domain: energy
description:
  purpose: 'REData API (Red Electrica de Espana): generation by technology (estructura-generacion) and electric
    balance (balance-electrico) for the Canarias electric system (geo_limit=canarias, geo_ids=8742), as JSON:API
    style documents with time series values and percentages.'
  limitations: 'Units, the list of technologies and the meaning of percentage are not documented on the API page
    read; attributes vary by widget. No licence/terms on the API page: the research notes point to the generic REE
    legal notice (https://www.ree.es/es/aviso-legal) as orientative, not read in this pass. No versioning, no SLA,
    no publication cadence (response carries last-update and meta.cache-control). geo_ids=8742 for Canarias was
    taken from the sibling source E01 sample, not from the API documentation read here. Hourly generation requests
    (23 days and 4 days) returned HTTP 400 ''Error Interno'' on 2026-10-24 (stored in error_hour_range23days.json);
    hourly data for generation was therefore not sampled. Only 2025 daily, 2026 daily (up to 2026-10-23/24) and
    2025 monthly balance were obtained. Series contain gaps by technology. Only two widgets of about 100 were sampled.'
  usage: Query /{lang}/datos/{category}/{widget} with start_date, end_date, time_trunc and geo_trunc/geo_limit/geo_ids;
    flatten included[].attributes.values[].
tags:
- ree
- redata
- electricity
- generation
- canarias
- api
