status: draft
name: REE REData - Electricity demand evolution (Canarias electric system)
domain: energy
description:
  purpose: Hourly/daily/monthly evolution of electricity demand published by Red Electrica de Espana through the
    REData API (widget demanda/evolucion), requested here for the Canarias electric system (geo_limit=canarias).
  limitations: Unit of 'value' is not declared by the producer (hourly values of 779-1446 and daily values of 20944-29615
    were observed; no unit stated). Meaning of 'percentage' beyond 'proportion between 0 and 1' is not defined.
    Time zone is not documented; observed ISO offsets +02:00 (October 2026) and +01:00 (January 2025). Geographic
    ids are only partly documented (8741 peninsular, 7 Castilla-La Mancha); geo_ids=8742 for Canarias was used in
    the request and returned data but is not in the documentation read. The widget 'evolucion' under category 'demanda'
    was not found in the widget list of the documentation text read, although it returned data. Update periodicity,
    latency, rate limits and maximum date range are not documented. An hourly request over 2026-09-01..2026-10-23
    returned HTTP 400 (Error Interno); a 23-day hourly request and a 365-day daily request succeeded, so the real
    range limit is unknown. No licence is declared on the API page; the site legal notice requires naming the company
    as source, stating the date of last update and not altering the meaning, and allows informational non-commercial
    use; no formal licence named. No version in the URL, no deprecation policy. Fields 'code' and 'expireAt' are
    documented but were not observed. Field 'icon' was observed but is not documented.
  usage: 'Raw landing of the JSON response; flatten included[].attributes.values[] to one row per datetime. Request
    parameters: start_date, end_date (YYYY-MM-DDTHH:MM), time_trunc (hour, day, month, year), geo_trunc=electric_system,
    geo_limit=canarias, geo_ids=8742.'
tags:
- energy
- electricity
- demand
- canarias
- api
- json
