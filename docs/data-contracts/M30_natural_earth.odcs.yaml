apiVersion: v3.2.0
kind: DataContract
id: 6c7270d0-7798-5fdd-a6d0-12b7ae5a1f44
version: 0.1.0
status: draft
name: Natural Earth 10m admin-0 countries
domain: geography
description:
  purpose: Public-domain world country boundaries at 1:10m scale with ISO/FIPS codes and thematic attributes,
    from Natural Earth.
  limitations: 'Sample is the complete shapefile (258 features, 168 attribute columns, zip 4.9 MB) taken
    on 2026-10-24; attributes were read from the DBF with a minimal local reader, geometry was only inspected
    at header and bounding-box level. The producer publishes no attribute dictionary: the theme page only
    describes ISO/FIPS/INSEE codes, UN region coding and thematic data in general terms; columns other
    than those named in the changelog are ''observed'' only. Placeholder value ''-99'' appears in code
    columns (ISO_A2 etc.) for some features; its meaning is not documented. Columns change between releases
    (see CHANGELOG). Canary Islands are not a separate feature: the Spain geometry spans them. No SLA,
    no quality rules; releases are irregular (latest on the theme page 5.1.1; changelog reaches 5.2.0).
    Population/GDP columns (POP_EST, GDP_MD, etc.) have undocumented vintages beyond POP_YEAR/GDP_YEAR
    values; the third-party sources are not detailed in the pages read.'
  usage: Download the zip and read the shapefile; useful as a base layer or to resolve Spain geometry.
    Citation is optional ('Made with Natural Earth').
tags:
- natural-earth
- geography
- boundaries
- shapefile
