apiVersion: v3.2.0
kind: DataContract
id: 2b547557-dd53-5bb6-875d-14e3c6e0aa62
version: 0.1.0
status: draft
name: NOAA NDBC buoy and station observations (latest_obs, realtime2, activestations)
domain: marine-weather
description:
  purpose: 'Near-real-time meteorological and wave observations from NOAA National Data Buoy Center stations: latest
    observation per station (latest_obs.txt), rolling 45-day station files (data/realtime2/<station>.txt) and the
    active-stations list (activestations.xml).'
  limitations: Missing-value marker MM is observed in the files but not stated in the documentation read. Column
    definitions of latest_obs.txt, STN/LAT/LON and the activestations.xml attributes are not described by the producer
    (only the file's own header lines and an elevation comment). Timestamps are UTC per the measurement descriptions
    page; the realtime2 file page states no time zone. No numeric request limit (only 'limit your retrievals to
    a minimal level'). No licence stated on the pages read; the site footer links to the NWS disclaimer, which says
    NWS web information is public domain unless noted otherwise; applicability to every NDBC file is unverified.
    Not every data type exists at every station. The realtime2 txt sample is a single buoy (41041, North Equatorial
    Atlantic), not a Canarias station; no NDBC station near the Canary Islands has been selected. Columns VIS and
    TIDE are 100% MM in the 41041 sample. realtime2 files describe 10-minute rows although the page says most stations
    report hourly. Automatic real-time quality control is mentioned but its rules are not detailed. Column order
    differs between latest_obs and realtime2. Other realtime2 file types (spec, cwind, ocean...) were not sampled.
    FTP is announced to be discontinued in favour of HTTPS.
  usage: Raw text landing; parse headers by name, treat MM as null, build timestamp from date parts in UTC, join
    station id to activestations for position.
tags:
- marine
- weather
- buoys
- noaa
- txt
- xml
