apiVersion: v3.2.0
kind: DataContract
id: 2c197025-e429-5000-a649-df5b2ee3bcd4
version: 0.1.0
status: draft
name: DGT DATEX II SituationPublication (road traffic incidents, Spain)
domain: mobility
description:
  purpose: 'Real-time road incident feed of the Spanish traffic authority (DGT) through its National Access Point (NAP): DATEX
    II v3 SituationPublication, DGT profile 3.7 (file datex2_v37.xml). Each situation groups one or more situation records
    (roadworks, lane closures, speed restrictions, accidents, vehicles stuck, weather and surface conditions) with cause,
    validity period and a location (road, kilometre point, coordinates, municipality, province, autonomous community) as a
    segment or a point. Coverage per the NAP: Spanish national road network excluding the Basque Country and Catalonia.'
  limitations: |-
    - The profile PDF describes the structure with class diagrams and annotated XML examples, not a field-by-field dictionary; descriptions here come from those annotations. Many elements (severity, overallSeverity, enumerations, units of speed/weight/width/length values, coordinate reference system) are not defined in the text read, and the XSD of the profile was not read.
    - The enumerated values listed for each column are observed in this one snapshot; the full enumerations are in the DATEX II schema and were not consulted. The extended values (_extended / _extendedValue) are not explained.
    - Coverage: the NAP states Catalonia and the Basque Country are excluded, yet the sample contains 6 point records in Cataluña (autonomousCommunity) - not explained. Canarias appears (18 point records, 18 segments by autonomous community).
    - The feed is a snapshot of currently active incidents (cache max-age 7 s observed, update every 1 minute per the NAP): no history; versions of a record are overwritten and expired records disappear.
    - Licence is ambiguous: the NAP dataset page says 'Licence and Free of charge', its footer shows Creative Commons Attribution (CC BY), and terms point to the DGT legal notice (not read). Treated as unverified.
    - Registered users get e-mail notices of outages and changes (2 months in advance); there is no SLA. Older profile versions exist as separate datasets (v3.6; v1 deprecated 12/01/2026 per earlier research).
    - The flattened columns are a modelling choice of this contract; the raw XML is the source of truth. Some columns hold non-ASCII text (names of places).
  usage: Download the XML periodically, parse situation/situationRecord, and keep (record id, version, load time). Treat identifiers
    as strings, timestamps as ISO 8601 with offset. Filter Canary Islands by autonomousCommunity = Canarias. Cite DGT as source
    per the NAP terms.
tags:
- mobility
- traffic
- road
- datex2
- dgt
- spain
- near-real-time
- xml
schema:
- name: situation_record_flat
  logicalType: object
  physicalType: xml
  description: One row per situationRecord of the DATEX II v3 (DGT profile 3.7_1.0) SituationPublication XML. The source is
    a nested XML document (payload > situation > situationRecord); the contract flattens each situationRecord into columns
    named after the element path relative to situationRecord (attributes marked with @). Columns appear only when the element
    occurs in the sample; a record has only the elements that apply to its type and location kind (linear segment from/to
    or single point).
  properties:
  - name: situation_id
    logicalType: string
    physicalType: xml element (text)
    description: Identifier of the situation (attribute id of the element situation); a situation groups 1..n situation records.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 648
    - property: observed_unique_in_sample
      value: false
    - property: observed_min
      value: 2816645.0
    - property: observed_max
      value: 24987580.0
  - name: situation_overallSeverity
    logicalType: string
    physicalType: xml element (text)
    description: Overall severity of the situation (child element overallSeverity of situation). Not defined by the producer
      in the profile document read (element observed in the sample).
    customProperties:
    - property: evidence
      value: observed
    - property: observed_null_pct
      value: 87.234
    - property: observed_distinct
      value: 2
    - property: observed_unique_in_sample
      value: false
    - property: observed_min
      value: highest
    - property: observed_max
      value: medium
    - property: observed_values
      value:
      - highest
      - medium
  - name: situation_informationStatus
    logicalType: string
    physicalType: xml element (text)
    description: Information status of the situation header (headerInformation/informationStatus); example value real.
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 1
    - property: observed_unique_in_sample
      value: false
    - property: observed_min
      value: real
    - property: observed_max
      value: real
    - property: observed_values
      value:
      - real
  - name: record@id
    logicalType: string
    physicalType: xml attribute
    description: Identifier of the situation record (attribute id).
    customProperties:
    - property: evidence
      value: documented+observed
    - property: observed_null_pct
      value: 0.0
    - property: observed_distinct
      value: 846
    - property: observed_unique_in_sample
      value: true
    - property: observed_min
      value: 5684393.0
    - property: observed_max
      value: 29358426.0
