  - name: record@type
    logicalType: string
    physicalType: xml attribute xsi:type
    description: 'DATEX II type of the situation record (xsi:type). Types used by the DGT profile: GenericSituationRecord,
      RoadOrCarriagewayOrLaneManagement, WinterDrivingManagement, SpeedManagement, GeneralInstructionOrMessageToRoadUsers,
      MaintenanceWorks, AbnormalTraffic, PoorEnvironmentConditions, NonWeatherRelatedRoadConditions, VehicleObstruction, AnimalPresenceObstruction,
      GeneralObstruction, TransitInformation (list as read in the profile summary; the sample uses a subset).'
