# Declarative Automation Bundle: canarias_lakehouse. Resources are in resources/*.yml.
bundle:
  name: canarias_lakehouse
  databricks_cli_version: ">=1.22.1"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every project object.
    default: workspace
  alert_email:
    description: Address that receives job failure notifications.
  deployer_service_principal:
    description: Application ID of the service principal that deploys and runs the staging and prod targets.
    default: ce2eebc9-d8fe-4ecd-8f3c-3f988f2deab5

targets:
  # Development: each developer deploys their own copy; resources and schemas are prefixed with dev_<user>_ and
  # schedules are paused.
  dev:
    mode: development
    default: true
    variables:
      alert_email: ${workspace.current_user.userName}

  # Staging: deployed by CI/CD on every merge to main; the job is run as the integration test. Same workspace as
  # prod (Free Edition has one); the name prefix also prefixes the schemas (staging_landing, staging_ops).
  # Schedules are paused.
  staging:
    mode: production
    presets:
      name_prefix: "[staging] "
      trigger_pause_status: PAUSED
    workspace:
      root_path: /Workspace/Users/${var.deployer_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deployer_service_principal}
    permissions:
      - service_principal_name: ${var.deployer_service_principal}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW

  # Production: deployed by CI/CD from a release tag after approval.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.deployer_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deployer_service_principal}
    permissions:
      - service_principal_name: ${var.deployer_service_principal}
        level: CAN_MANAGE
      - group_name: users
        level: CAN_VIEW
