name: CD

# Merge to main: deploy to staging and run the ingestion job as the integration test.
# Release tag vX.Y.Z on main: deploy to prod after approval in the prod environment.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  BUNDLE_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  staging:
    name: Deploy and test staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Deploy
        run: databricks bundle deploy -t staging
      - name: Run the ingestion job
        run: |
          echo "INTEGRATION_RUN_STARTED_AT=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          databricks bundle run ingest_gobierno_canarias_landing -t staging
      - name: Integration tests
        env:
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          INTEGRATION_AUDIT_TABLE: workspace.staging_ops.ingestion_audit
          INTEGRATION_ENVIRONMENT: staging
        run: uv run pytest -m integration tests/integration

  prod:
    name: Deploy prod
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
      - name: Check the release tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"; exit 1; }
      - name: Deploy
        run: databricks bundle deploy -t prod
