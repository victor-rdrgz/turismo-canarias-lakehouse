name: Bug
description: Something in the platform does not work as designed.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What fails, where (job, task, table, file) and since when.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The job, parameters or query that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Job run link, audit rows, error message. No secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for the bug to be considered fixed.
