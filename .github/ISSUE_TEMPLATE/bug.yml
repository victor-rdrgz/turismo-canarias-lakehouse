name: Bug
description: Something in the platform does not work as designed.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, where (job, task, table, file) and since when.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Job run link, audit rows, error message. No secrets or personal data.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
