name: Feature
description: New capability, data source or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is needed and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design options, references to documentation, open questions.
